# SPRINT-0048 Corpus Trace Manifest
#
# One row per SPRINT-0039 matrix trace (72 total: 71 corpus traces + mattermost/M-4 structural gap).
# This manifest drives the sweep runner and tracks per-trace lifecycle status.
#
# Status values:
#   pass            — focused Kind e2e passes
#   admission-skip  — AdmitCut/AdmitPlan refused the trace
#   build-skip      — patched package or extracted service failed to compile
#   e2e-fail        — Kind e2e failed (deploy, workload, oracle, or transcript mismatch)
#   timeout-skip    — trace exceeded per-trace timeout
#   manifest-skip   — trace skipped by manifest annotation (not attempted)
#   infra-fail      — infrastructure failure (cluster, docker, network)
#
# Fields:
#   trace_id        — unique corpus trace identifier (project/M-N)
#   project         — source project name
#   function        — recommended cut function name
#   file_line       — target file:line in the source project
#   state_class     — receiver/parameter state classification
#   boundary_class  — boundary data classification
#   status          — current trace status (see above)
#   phase           — sprint phase that addresses this trace (0-6 or "deferred")
#   skip_reason     — reason for skip when status is manifest-skip or admission-skip
#   e2e_package     — Go e2e target package name (when implemented)

