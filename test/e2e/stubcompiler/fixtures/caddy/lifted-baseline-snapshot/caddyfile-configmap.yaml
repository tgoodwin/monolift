apiVersion: v1
kind: ConfigMap
metadata:
  name: caddyfile
data:
  Caddyfile: |
    :8080 {
      header X-Caddy monolift-e2e

      handle /static/* {
        root * /srv
        file_server
      }

      handle /proxy* {
        reverse_proxy http://echo-upstream:8080
      }

      handle /headers {
        respond "headers ok"
      }
    }
