apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-deployment
  labels:
    app: monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolith
  template:
    metadata:
      labels:
        app: monolith
    spec:
      containers:
      - name: monolith-app
        imagePullPolicy: IfNotPresent
        image: docker.io/tlg2132/demo-monolith:latest
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_ADDRESS
          value: "monolith-redis.default.svc.cluster.local:6379"
        - name: REDIS_PASSWORD
          value: "redispass" # matches the password in redis.yaml
        # If using a Kubernetes Secret for the password, it would look like this:
        # - name: REDIS_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: redis-secret # Name of your Secret object
        #       key: password     # Key within the Secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"