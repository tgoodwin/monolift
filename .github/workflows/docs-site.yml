name: docs-site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install docs toolchain
        run: python -m pip install -r docs/site/requirements.txt

      - name: Policy guard
        run: make docs-site-check-policy

      - name: Snippet drift check
        run: make docs-site-check-drift

      - name: External snippet refresh is a no-op
        run: |
          python scripts/refresh-external-snippets.py
          git diff --exit-code -- docs/site/snippets/external/ \
            || (echo "refresh-external-snippets produced a diff; commit the updated .go.txt files"; exit 1)

      - name: MkDocs build (strict)
        run: python -m mkdocs build --strict -f mkdocs.yml

      - name: Lychee link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir docs/site/site
            docs/site/site
          fail: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/site

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
