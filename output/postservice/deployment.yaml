apiVersion: apps/v1
kind: Deployment
metadata:
  name: postservice
  namespace: monolift
  labels:
    app.kubernetes.io/name: postservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postservice
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: postservice
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: postservice
          image: ghcr.io/tgoodwin/postservice:latest
          ports:
            - containerPort: 8080
          env: