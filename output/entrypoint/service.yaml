apiVersion: v1
kind: Service
metadata:
  name: entrypoint-service
  namespace: monolift
  labels:
    app.kubernetes.io/name: entrypoint
spec:
  type: ClusterIP # TODO respect the original service configuration if there was one
  selector:
    app.kubernetes.io/name: entrypoint
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080