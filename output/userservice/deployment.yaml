apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: monolift
  labels:
    app.kubernetes.io/name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: userservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: userservice
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: userservice
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: userservice
          image: docker.io/tlg2132/userservice:latest
          ports:
            - containerPort: 8080
          env: