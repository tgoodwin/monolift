apiVersion: apps/v1
kind: Deployment
metadata:
  name: timelineservice
  namespace: monolift
  labels:
    app.kubernetes.io/name: timelineservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timelineservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timelineservice
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: timelineservice
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: timelineservice
          image: ghcr.io/tgoodwin/timelineservice:latest
          ports:
            - containerPort: 8080
          env: