apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialgraph
  namespace: monolift
  labels:
    app.kubernetes.io/name: socialgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: socialgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socialgraph
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: socialgraph
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: socialgraph
          image: ghcr.io/tgoodwin/socialgraph:latest
          ports:
            - containerPort: 8080
          env: