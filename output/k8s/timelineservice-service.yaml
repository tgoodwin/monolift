apiVersion: v1
kind: Service
metadata:
  name: timelineservice
  namespace: default
  labels: # Recommended labels for Kubernetes
    app.kubernetes.io/name: timelineservice
    discrete.events/experiment: monolift
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: timelineservice
  ports:
    - name: http
      protocol: TCP
      port: 80 # Standard service port
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: timelineservice-metrics
  namespace: default
  labels:
    app.kubernetes.io/name: timelineservice
    # TODO add monolift.com/metrics label to scrape if prometheus is set up
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: timelineservice
  ports:
    - name: http-metrics
      port: 8084
      targetPort: 8084