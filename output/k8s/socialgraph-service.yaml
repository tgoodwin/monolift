apiVersion: v1
kind: Service
metadata:
  name: socialgraph
  namespace: default
  labels: # Recommended labels for Kubernetes
    app.kubernetes.io/name: socialgraph
    discrete.events/experiment: monolift # Custom label for the experiment
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: socialgraph
  ports:
    - name: http
      protocol: TCP
      port: 80 # Standard service port
      targetPort: 8080