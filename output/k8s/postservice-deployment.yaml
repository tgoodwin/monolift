apiVersion: apps/v1
kind: Deployment
metadata:
  name: postservice
  namespace: default
  labels:
    app.kubernetes.io/name: postservice
    discrete.events/experiment: monolift
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postservice
        discrete.events/experiment: monolift
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: postservice
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: postservice
          image: ghcr.io/tgoodwin/postservice:latest
          ports:
            - containerPort: 8080
          env:
            - name: K8S_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: postservice
                  resource: requests.cpu
                  divisor: "1m"
            - name: K8S_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: postservice
                  resource: limits.cpu
                  divisor: "1m"
            - name: K8S_MEMORY_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: postservice
                  resource: requests.memory
            - name: K8S_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: postservice
                  resource: limits.memory