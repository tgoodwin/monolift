apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: default
  labels: # Recommended labels for Kubernetes
    app.kubernetes.io/name: userservice
    discrete.events/experiment: monolift
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: userservice
  ports:
    - name: http
      protocol: TCP
      port: 80 # Standard service port
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: userservice-metrics
  namespace: default
  labels:
    app.kubernetes.io/name: userservice
    discrete.events/experiment: monolift
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: userservice
  ports:
    - name: http-metrics
      port: 8084
      targetPort: 8084