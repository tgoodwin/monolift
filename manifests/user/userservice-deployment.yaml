apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: default
  labels:
    app.kubernetes.io/name: userservice
    discrete.events/experiment: monolift
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: userservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: userservice
        discrete.events/experiment: monolift
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: userservice
        dapr.io/app-port: "8080"
    spec:
      tolerations:
      - key: "tier"
        operator: "Equal"
        value: "backend"
        effect: "PreferNoSchedule"
      containers:
        - name: userservice
          image: ghcr.io/tgoodwin/userservice:user-decomposition
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: 2
              memory: 2Gi
          env:
            - name: K8S_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: userservice
                  resource: requests.cpu
                  divisor: "1m"
            - name: K8S_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: userservice
                  resource: limits.cpu
                  divisor: "1m"
            - name: K8S_MEMORY_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: userservice
                  resource: requests.memory
            - name: K8S_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: userservice
                  resource: limits.memory
