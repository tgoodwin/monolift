apiVersion: apps/v1
kind: Deployment
metadata:
  name: timelineservice
  namespace: default
  labels:
    app.kubernetes.io/name: timelineservice
    discrete.events/experiment: monolift
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: timelineservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timelineservice
        discrete.events/experiment: monolift
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: timelineservice
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: timelineservice
          image: docker.io/eirn/timelineservice:full
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: 4
  
          env:
            - name: K8S_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: timelineservice
                  resource: requests.cpu
                  divisor: "1m"
            - name: K8S_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: timelineservice
                  resource: limits.cpu
                  divisor: "1m"
            - name: K8S_MEMORY_REQUEST
              valueFrom:
                resourceFieldRef:
                  containerName: timelineservice
                  resource: requests.memory
            - name: K8S_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: timelineservice
                  resource: limits.memory
            - name: TIMELINE_NUM_WORKERS
              value: "3000"
            - name: TIMELINE_BUFFER_SIZE
              value: "30000"