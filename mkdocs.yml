site_name: Monolift
site_url: https://tgoodwin.github.io/monolift/
site_description: Monolift — design story of a Go monolith-to-microservices compiler
docs_dir: docs/site/docs
site_dir: docs/site/site
repo_url: https://github.com/tgoodwin/monolift
repo_name: tgoodwin/monolift
edit_uri: edit/main/docs/site/docs/
strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/monolift.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here:
      - Home: index.md
      - How Monolift works, in one example: walkthrough.md
      - What's changing after the initial workshop paper: v1-to-v2.md
  - The compiler, stage by stage:
      - Reasoning about liftability: canonical-shapes.md
      - Pattern matching on stateful code: state-class-inference.md
      - Making the compiler opinionated: refusal-diagnostics.md
      - Recovering activation paths: activation-paths.md
      - Drawing the network boundary: cut-placement.md
      - Adapting the network boundary: boundary-adapters.md
      - Code extraction: extraction.md
  - Evaluation questions:
      - evaluation-questions/index.md
      - Does the compiler generalize to real, production codebases?: evaluation-questions/generalizes-to-real-codebases.md
      - Can the compiler's refusal codes aid refactoring?: evaluation-questions/refusal-codes-guide-refactoring.md
      - Can Monolift improve application performance?: evaluation-questions/performance-analysis.md
  - Project & reference:
      - Working backwards: working-backwards.md
      - Evaluation targets: evaluation-targets.md
      - Finding your way around the code: reading-guide.md
